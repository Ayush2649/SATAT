name: SATAT CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "codex/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Set up Python for offline evaluator contracts
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate offline meal evaluator (no model or GPU)
        run: python -m unittest discover -s ml/indian_meals -p 'test_benchmark.py' -v

      - name: Install image dependency for research importer tests
        run: python -m pip install "Pillow==13.0.0"

      - name: Validate research data importer (generated images only)
        run: python -m unittest discover -s ml/indian_meals -p 'test_prepare_khana.py' -v

      - name: Type check (TypeScript)
        run: npx tsc --noEmit

      - name: Lint (ESLint)
        run: npm run lint

      - name: Run unit & invariant tests (Vitest)
        run: npm test

      - name: Build production application (Next.js)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

